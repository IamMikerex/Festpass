<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07050e" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Mirrors load()/effective() in src/lib/prefs.jsx so the saved look applies before first paint.
      try {
        var s = JSON.parse(localStorage.getItem('festpass.prefs')) || {};
        if (!s.v && s.theme === 'purple' && s.logo === 'ticket' && s.bg === 'beams' && s.motion === 'calm' && s.glow !== false && s.tilt !== false) s = {};
        var p = Object.assign({ theme: 'sunset', bg: 'beams', motion: 'calm', glow: true, tilt: true, reduce: false, contrast: false, text: 'md', focus: false, simple: false }, s);
        var still = p.reduce || matchMedia('(prefers-reduced-motion: reduce)').matches;
        Object.assign(document.documentElement.dataset, {
          theme: p.theme, bg: p.bg, text: p.text, motion: still ? 'off' : p.motion,
          glow: p.glow && !p.simple && !still ? 'on' : 'off', tilt: p.tilt && !p.simple && !still ? 'on' : 'off',
          reduce: still ? 'on' : 'off', fx: p.simple ? 'off' : 'on', contrast: p.contrast ? 'high' : 'normal', focus: p.focus ? 'strong' : 'normal'
        });
      } catch (e) { document.documentElement.dataset.theme = 'sunset'; }
    </script>
    <title>FestPass · Festival tickets & vendors</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
