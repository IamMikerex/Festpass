# /etc/nginx/sites-available/festpass  (bare-metal option, see DEPLOYMENT.md)
# Get a certificate first: sudo certbot --nginx -d festpass.example.com
server {
    listen 80;
    server_name festpass.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name festpass.example.com;
    ssl_certificate     /etc/letsencrypt/live/festpass.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/festpass.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Express serves the React build, /api, and forwards /analytics to FastAPI.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }
}
